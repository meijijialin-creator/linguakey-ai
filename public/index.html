
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinguaKey — AI Language Studio</title>
<style>
:root{--ink:#292638;--muted:#8d899d;--accent:#7965ba;--deep:#55468d;--line:#eae6f0;--bg:#f8f7f5;--card:#fff;--lav:#f0ebfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 4%,#ece5fa 0,transparent 34%),radial-gradient(circle at 3% 96%,#f8eae8 0,transparent 30%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;min-height:100vh}button,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c5b5ec;outline-offset:2px}.wrap{max-width:1050px;margin:auto;padding:34px 28px 54px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}.brand{display:flex;gap:11px;align-items:center;font-weight:750;font-size:19px;letter-spacing:-.6px}.logo{display:grid;place-items:center;width:37px;height:37px;border-radius:13px;background:#7663b7;color:white;font-size:20px;box-shadow:0 5px 12px #7561b53a}.tag{font-size:11px;color:var(--accent);background:#f0ebfa;border:1px solid #e3daf6;border-radius:30px;padding:7px 12px;letter-spacing:1.2px;font-weight:750}.hero{text-align:center;margin-bottom:35px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;color:#9a88c5}.hero h1{font-size:clamp(30px,5vw,49px);line-height:1.18;letter-spacing:-1.9px;margin:15px 0 12px;font-weight:800}.hero h1 span{color:#816ec0}.hero p{font-size:14px;color:var(--muted);line-height:1.8;margin:0}.studio{background:var(--card);border:1px solid #eeebf1;border-radius:27px;box-shadow:0 18px 60px #3427500c;overflow:hidden}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:21px 25px;border-bottom:1px solid var(--line);flex-wrap:wrap}.toolbar-title{font-size:12px;font-weight:800;color:#8e879f;letter-spacing:1.5px}.language-picker{display:flex;gap:9px;align-items:center}.language-picker select{background:#faf9fc;border:1px solid #eae6f0;border-radius:11px;padding:10px 29px 10px 12px;font-size:13px;color:var(--ink);font-weight:700;max-width:145px}.swap{border:1px solid #e8e2f1;background:#f4f0fb;color:var(--accent);width:37px;height:37px;border-radius:50%;font-size:20px;line-height:1}.panes{display:grid;grid-template-columns:1fr 1fr}.pane{padding:26px;min-width:0}.pane+.pane{border-left:1px solid var(--line);background:#fefdfd}.panehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.panehead strong{font-size:13px}.hint{font-size:11px;color:#aaa5b4}.pane textarea{width:100%;height:178px;resize:vertical;border:0;outline:0!important;background:transparent;color:var(--ink);font-size:18px;line-height:1.75;padding:0;letter-spacing:.1px}.pane textarea::placeholder{color:#c0bacb}.result{color:#5e4b91!important}.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:36px}.tiny{font-size:11px;color:#a29bad}.ghost{background:transparent;border:1px solid #e8e3ef;border-radius:9px;padding:8px 11px;font-size:12px;color:#71618f;font-weight:700}.controls{padding:22px 26px 25px;border-top:1px solid var(--line);background:#fdfcff}.controlrow{display:flex;align-items:center;gap:13px;flex-wrap:wrap}.controlname{font-size:12px;color:#948da0;font-weight:700;margin-right:3px}.tone{background:#fff;border:1px solid #e9e4ee;border-radius:999px;padding:9px 15px;color:#766e83;font-size:12px;font-weight:700;transition:.15s}.tone.active{background:#eee9fa;border-color:#cbbcea;color:#6851a5}.translate{margin-left:auto;border:0;border-radius:13px;background:#7661b7;color:#fff;font-weight:750;padding:12px 23px;box-shadow:0 7px 15px #7661b72c}.translate:hover{background:#6550a5}.translate:disabled{opacity:.6;cursor:wait}.keyboardbox{margin-top:18px;background:#fff;border:1px solid #eeebf2;border-radius:23px;padding:20px 25px;box-shadow:0 10px 35px #34275009}.keyboardtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.keyboardtop strong{font-size:13px}.keyboardtop span{font-size:11px;color:#aaa3b5}.keyboard{display:flex;flex-direction:column;gap:7px;align-items:center}.keyrow{display:flex;justify-content:center;gap:6px;width:100%}.key{flex:1;max-width:67px;min-width:0;border:1px solid #eae7ee;border-bottom:2px solid #ddd8e7;background:#fbfafc;border-radius:9px;padding:12px 3px;font-size:15px;font-weight:650;color:#51495f;transition:background .1s}.key:active{background:#e9e0f7}.key.special{background:#f2edf9;color:#705da5;max-width:110px}.key.space{max-width:330px;flex:5}.kbdnote{text-align:center;margin:13px 0 0;color:#a7a1b1;font-size:11px;line-height:1.6}.footer{text-align:center;color:#aaa3b4;font-size:11px;margin-top:28px;letter-spacing:.3px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#342b4c;color:white;padding:12px 20px;border-radius:12px;box-shadow:0 8px 25px #0002;font-size:13px;display:none;z-index:3}@media(max-width:700px){.wrap{padding:22px 13px 35px}.top{margin-bottom:38px}.hero{margin-bottom:24px}.studio{border-radius:20px}.toolbar{padding:17px;justify-content:center}.toolbar-title{display:none}.language-picker{width:100%;justify-content:center}.language-picker select{flex:1;max-width:none}.panes{grid-template-columns:1fr}.pane{padding:20px}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.pane textarea{height:135px;font-size:16px}.controls{padding:17px}.translate{width:100%;margin-left:0}.keyboardbox{padding:16px 9px}.keyrow{gap:3px}.key{padding:11px 1px;font-size:12px;border-radius:6px}.key.special{font-size:11px}.keyboardtop{padding:0 8px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><span class="logo">⌘</span> LinguaKey<span style="color:#9884ce">.</span></div><div class="tag">AI LANGUAGE STUDIO</div></header>
<section class="hero"><div class="eyebrow">WORDS WITHOUT BORDERS</div><h1>让每一种语言，<span>恰如其分。</span></h1><p>从日常对话到正式表达，让 AI 帮你找到更自然、更得体的措辞。</p></section>
<main class="studio"><div class="toolbar"><div class="toolbar-title">TRANSLATION WORKSPACE</div><div class="language-picker"><select id="from" aria-label="原文语言"><option value="zh">🇨🇳 中文</option><option value="ko">🇰🇷 한국어</option><option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option></select><button class="swap" onclick="swap()" title="交换语言">⇄</button><select id="to" aria-label="目标语言"><option value="ko">🇰🇷 한국어</option><option value="zh">🇨🇳 中文</option><option value="en">🇺🇸 English</option><option value="ja">🇯🇵 日本語</option></select></div></div>
<div class="panes"><section class="pane"><div class="panehead"><strong>✦ 原文输入</strong><span class="hint" id="sourceLabel">SOURCE TEXT</span></div><textarea id="input" maxlength="5000" placeholder="在这里输入想表达的话……" aria-label="原文输入"></textarea><div class="tools"><span class="tiny" id="count">0 / 5000</span><button class="ghost" onclick="clearInput()">清空内容 ×</button></div></section><section class="pane"><div class="panehead"><strong>✧ AI 润色翻译</strong><span class="hint">TRANSLATED TEXT</span></div><textarea class="result" id="output" readonly placeholder="好的表达，即将在这里出现。" aria-label="翻译结果"></textarea><div class="tools"><span class="tiny" id="status">准备就绪</span><button class="ghost" onclick="copyText()">⧉ 复制结果</button></div></section></div>
<div class="controls"><div class="controlrow"><span class="controlname">表达场景</span><button class="tone active" data-tone="natural" onclick="setTone('natural')">✧ 自然表达</button><button class="tone" data-tone="formal" onclick="setTone('formal')">♧ 教授 / 学术</button><button class="tone" data-tone="casual" onclick="setTone('casual')">☼ 日常聊天</button><button class="translate" id="translateButton" onclick="translateText()">✦ 开始 AI 翻译 →</button></div></div></main>
<section class="keyboardbox"><div class="keyboardtop"><strong>⌨ 多语言虚拟键盘</strong><span id="keyboardLabel">中文 · 拼音字母</span></div><div class="keyboard" id="keyboard"></div><p class="kbdnote" id="keyboardNote">支持屏幕点击输入；中文、日文等完整候选词建议使用电脑自带输入法。</p></section><div class="footer">LINGUAKEY AI · A SMALL STUDIO FOR BETTER COMMUNICATION</div>
</div><div class="toast" id="toast" role="status"></div>
<script>
const input=document.getElementById('input'),output=document.getElementById('output'),keyboard=document.getElementById('keyboard');
const from=document.getElementById('from'),to=document.getElementById('to');let currentTone='natural';
const layouts={zh:['qwertyuiop','asdfghjkl','zxcvbnm'],en:['qwertyuiop','asdfghjkl','zxcvbnm'],ja:['qwertyuiop','asdfghjkl','zxcvbnm'],ko:['ㅂㅈㄷㄱㅅㅛㅕㅑㅐㅔ','ㅁㄴㅇㄹㅎㅗㅓㅏㅣ','ㅋㅌㅊㅍㅠㅜㅡ']};
const labels={zh:'中文 · 拼音字母',ko:'한국어 · 두벌식 자모',en:'English · QWERTY',ja:'日本語 · ローマ字'};
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2600)}
// Korean two-set virtual keyboard composition (Unicode Hangul syllables).
const L=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const V=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const T=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const vowels=new Set(V), consonants=new Set(L);
const vowelJoin={'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ','ㅘㅣ':'ㅙ','ㅝㅣ':'ㅞ'};
const finalJoin={'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const finalSplit={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};
let hangul=null; // {l,v,t,start,end}; tracks only virtual-keyboard composition.
function syllable(l,v,t=''){if(v===null)return l;if(!L.includes(l))return v;return String.fromCharCode(0xAC00+(L.indexOf(l)*21+V.indexOf(v))*28+T.indexOf(t))}
function commitHangul(){hangul=null}
function paintHangul(){if(!hangul)return;const txt=syllable(hangul.l,hangul.v,hangul.t);input.setRangeText(txt,hangul.start,hangul.end,'end');hangul.end=hangul.start+txt.length;updateCount()}
function beginHangul(ch){const pos=input.selectionStart;hangul={l:ch,v:null,t:'',start:pos,end:pos};paintHangul()}
function insertHangul(ch){
 if(input.selectionStart!==input.selectionEnd || (hangul&&input.selectionStart!==hangul.end))commitHangul();
 if(!hangul){beginHangul(ch);input.focus();return}
 if(vowels.has(ch)){
  if(hangul.v===null){if(consonants.has(hangul.l)){hangul.v=ch;paintHangul()}else{commitHangul();beginHangul(ch)}}
  else if(hangul.t){const old=hangul.t,parts=finalSplit[old];hangul.t=parts?parts[0]:'';const next=parts?parts[1]:old;paintHangul();commitHangul();beginHangul(next);hangul.v=ch;paintHangul()}
  else {const combined=vowelJoin[hangul.v+ch];if(combined){hangul.v=combined;paintHangul()}else{commitHangul();beginHangul(ch)}}
 }else{
  if(hangul.v!==null && T.includes(ch)){
   if(!hangul.t){hangul.t=ch;paintHangul()}
   else if(finalJoin[hangul.t+ch]){hangul.t=finalJoin[hangul.t+ch];paintHangul()}
   else{commitHangul();beginHangul(ch)}
  }else{commitHangul();beginHangul(ch)}
 }
 input.focus()
}
function insertText(text){
 if(from.value==='ko' && text.length===1 && (vowels.has(text)||consonants.has(text))){insertHangul(text);return}
 commitHangul();const a=input.selectionStart,b=input.selectionEnd;input.setRangeText(text,a,b,'end');input.focus();updateCount()
}
function backspace(){
 if(hangul&&input.selectionStart===hangul.end){
  if(hangul.t){hangul.t=finalSplit[hangul.t]?.[0]||'';paintHangul();return}
  if(hangul.v!==null){const rev=Object.entries(vowelJoin).find(([k,v])=>v===hangul.v);if(rev){hangul.v=rev[0][0]}else{hangul.v=null}paintHangul();return}
  input.setRangeText('',hangul.start,hangul.end,'end');commitHangul();updateCount();return
 }
 commitHangul();const a=input.selectionStart,b=input.selectionEnd;if(a!==b){input.setRangeText('',a,b,'end')}else if(a>0){input.setRangeText('',a-1,a,'end')}input.focus();updateCount()
}
function renderKeyboard(){keyboard.innerHTML='';const lang=from.value;document.getElementById('keyboardLabel').textContent=labels[lang];for(const letters of layouts[lang]){const row=document.createElement('div');row.className='keyrow';for(const ch of Array.from(letters)){const key=document.createElement('button');key.type='button';key.className='key';key.textContent=ch;key.addEventListener('click',()=>insertText(ch));row.appendChild(key)}keyboard.appendChild(row)}const last=document.createElement('div');last.className='keyrow';const space=document.createElement('button');space.className='key space special';space.textContent='SPACE';space.onclick=()=>insertText(' ');const back=document.createElement('button');back.className='key special';back.textContent='⌫ 删除';back.onclick=backspace;const enter=document.createElement('button');enter.className='key special';enter.textContent='↵ 换行';enter.onclick=()=>insertText('\n');last.append(space,back,enter);keyboard.appendChild(last);document.getElementById('keyboardNote').textContent=lang==='ko'?'支持虚拟键盘韩文音节组合：ㅇ + ㅏ + ㄴ → 안。实体键盘请使用系统韩语输入法。':lang==='ja'?'虚拟键盘输入罗马字；转换假名请使用电脑日语输入法。':lang==='zh'?'虚拟键盘输入拼音字母；选择汉字请使用电脑中文输入法。':'点击虚拟键盘或使用电脑实体键盘输入。'}
function updateCount(){document.getElementById('count').textContent=input.value.length+' / 5000'}
function clearInput(){commitHangul();input.value='';output.value='';document.getElementById('status').textContent='准备就绪';updateCount();input.focus()}
function swap(){commitHangul();const x=from.value;from.value=to.value;to.value=x;const old=input.value;if(output.value&&!output.value.startsWith('翻译失败')){input.value=output.value;output.value=old}renderKeyboard();updateCount()}
function setTone(tone){currentTone=tone;document.querySelectorAll('.tone').forEach(b=>b.classList.toggle('active',b.dataset.tone===tone))}
async function translateText(){const text=input.value.trim();if(!text){toast('请先输入需要翻译的内容');input.focus();return}const btn=document.getElementById('translateButton');btn.disabled=true;btn.textContent='正在翻译…';output.value='';document.getElementById('status').textContent='AI 正在组织语言…';try{const response=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:from.value,target:to.value,tone:currentTone})});const data=await response.json();if(!response.ok)throw new Error(data.error||'服务器暂时不可用');output.value=data.translation||'';document.getElementById('status').textContent=output.value?'翻译完成 ✓':'未收到译文'}catch(error){document.getElementById('status').textContent='翻译失败';output.value='翻译失败：'+error.message}finally{btn.disabled=false;btn.textContent='✦ 开始 AI 翻译 →'}}
async function copyText(){if(!output.value){toast('目前没有可复制的译文');return}try{await navigator.clipboard.writeText(output.value);toast('译文已复制 ✓')}catch(error){output.focus();output.select();toast('请按 ⌘C / Ctrl+C 复制选中文字')}}
from.addEventListener('change',()=>{commitHangul();renderKeyboard()});input.addEventListener('input',()=>{if(hangul&&input.selectionStart!==hangul.end)commitHangul();updateCount()});input.addEventListener('click',()=>{if(hangul&&input.selectionStart!==hangul.end)commitHangul()});renderKeyboard();updateCount();
</script></body></html>
