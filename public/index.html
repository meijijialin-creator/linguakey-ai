const kanaBase={a:'あ',i:'い',u:'う',e:'え',o:'お',ka:'か',ki:'き',ku:'く',ke:'け',ko:'こ',sa:'さ',shi:'し',si:'し',su:'す',se:'せ',so:'そ',ta:'た',chi:'ち',ti:'ち',tsu:'つ',tu:'つ',te:'て',to:'と',na:'な',ni:'に',nu:'ぬ',ne:'ね',no:'の',ha:'は',hi:'ひ',fu:'ふ',hu:'ふ',he:'へ',ho:'ほ',ma:'ま',mi:'み',mu:'む',me:'め',mo:'も',ya:'や',yu:'ゆ',yo:'よ',ra:'ら',ri:'り',ru:'る',re:'れ',ro:'ろ',wa:'わ',wo:'を',n:'ん',ga:'が',gi:'ぎ',gu:'ぐ',ge:'げ',go:'ご',za:'ざ',ji:'じ',zi:'じ',zu:'ず',ze:'ぜ',zo:'ぞ',da:'だ',di:'ぢ',du:'づ',de:'で',do:'ど',ba:'ば',bi:'び',bu:'ぶ',be:'べ',bo:'ぼ',pa:'ぱ',pi:'ぴ',pu:'ぷ',pe:'ぺ',po:'ぽ',kya:'きゃ',kyu:'きゅ',kyo:'きょ',sha:'しゃ',shu:'しゅ',sho:'しょ',sya:'しゃ',syu:'しゅ',syo:'しょ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',tya:'ちゃ',tyu:'ちゅ',tyo:'ちょ',nya:'にゃ',nyu:'にゅ',nyo:'にょ',hya:'ひゃ',hyu:'ひゅ',hyo:'ひょ',mya:'みゃ',myu:'みゅ',myo:'みょ',rya:'りゃ',ryu:'りゅ',ryo:'りょ',gya:'ぎゃ',gyu:'ぎゅ',gyo:'ぎょ',ja:'じゃ',ju:'じゅ',jo:'じょ',jya:'じゃ',jyu:'じゅ',jyo:'じょ',bya:'びゃ',byu:'びゅ',byo:'びょ',pya:'ぴゃ',pyu:'ぴゅ',pyo:'ぴょ',fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',wi:'うぃ',we:'うぇ',va:'ゔぁ',vi:'ゔぃ',vu:'ゔ',ve:'ゔぇ',vo:'ゔぉ',xtsu:'っ',ltsu:'っ',xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ'};
function asKana(s){return kanaMode==='kata'?Array.from(s).map(c=>{const n=c.charCodeAt(0);return n>=0x3041&&n<=0x3096?String.fromCharCode(n+96):c}).join(''):s}
function convertRomaji(raw,final=false){if(raw==='konnichiwa')return asKana('こんにちは');let out='',i=0;while(i<raw.length){const rest=raw.slice(i);if(rest[0]==='n'&&(rest.length===1||rest[1]==="'"||(!'aiueoyn'.includes(rest[1])&&/[a-z]/.test(rest[1])))){if(rest.length===1&&!final)break;out+='ん';i+=rest[1]==="'"?2:1;continue}if(rest.startsWith('nn')){out+='ん';i+=1;continue}if(rest.length>=2&&rest[0]===rest[1]&&/[bcdfghjklmpqrstvwxyz]/.test(rest[0])&&rest[0]!=='n'){out+='っ';i++;continue}let found=false;for(let n=3;n>=1;n--){const part=rest.slice(0,n);if(part.length===n&&kanaBase[part]){out+=kanaBase[part];i+=n;found=true;break}}if(found)continue;const maybe=Object.keys(kanaBase).some(k=>k.startsWith(rest));if(maybe&&!final)break;out+=rest[0];i++}return asKana(out)+raw.slice(i)}
function imeBar(){return document.getElementById('imebar')}
function clearImeBar(){imeBar().replaceChildren();imeBar().classList.remove('visible')}
function cancelCompositions(){commitHangul();zhState=null;jaState=null;clearImeBar()}
function paintZh(){if(!zhState)return;input.setRangeText(zhState.raw,zhState.start,zhState.end,'end');zhState.end=zhState.start+zhState.raw.length;updateCount();const bar=imeBar();bar.replaceChildren();bar.classList.add('visible');const options=pinyinWords[zhState.raw.toLowerCase()]||[];const label=document.createElement('span');label.className='imehint';label.textContent=zhState.raw+' → '+(options.length?'选择汉字':'未收录，可继续输入或按空格保留拼音');bar.appendChild(label);options.slice(0,8).forEach((word,i)=>{const b=document.createElement('button');b.type='button';b.className='imechip'+(i===0?' active':'');b.textContent=(i+1)+'. '+word;b.onclick=()=>chooseZh(word);bar.appendChild(b)})}
function chooseZh(word){if(!zhState)return;input.setRangeText(word,zhState.start,zhState.end,'end');zhState=null;clearImeBar();updateCount();input.focus()}
function commitZh(){if(!zhState)return;const options=pinyinWords[zhState.raw.toLowerCase()];chooseZh(options?.[0]||zhState.raw)}
function insertZh(ch){commitHangul();if(zhState&&input.selectionStart!==zhState.end)commitZh();if(!zhState){const pos=input.selectionStart;zhState={start:pos,end:pos,raw:''}}zhState.raw+=ch.toLowerCase();paintZh();input.focus()}
function paintJa(){if(!jaState)return;const txt=convertRomaji(jaState.raw);input.setRangeText(txt,jaState.start,jaState.end,'end');jaState.end=jaState.start+txt.length;updateCount();const bar=imeBar();bar.replaceChildren();bar.classList.add('visible');const label=document.createElement('span');label.className='imehint';label.textContent='ローマ字: '+jaState.raw+' → '+txt;bar.appendChild(label);const mode=document.createElement('button');mode.type='button';mode.className='imechip';mode.textContent=kanaMode==='hira'?'切换为片假名 カタカナ':'切换为平假名 ひらがな';mode.onclick=toggleKana;bar.appendChild(mode)}
function commitJa(){if(!jaState)return;const txt=convertRomaji(jaState.raw,true);input.setRangeText(txt,jaState.start,jaState.end,'end');jaState=null;clearImeBar();updateCount()}
function insertJa(ch){commitHangul();if(jaState&&input.selectionStart!==jaState.end)commitJa();if(!jaState){const pos=input.selectionStart;jaState={start:pos,end:pos,raw:''}}jaState.raw+=ch.toLowerCase();paintJa();input.focus()}
function toggleKana(){if(jaState){kanaMode=kanaMode==='hira'?'kata':'hira';paintJa()}else{kanaMode=kanaMode==='hira'?'kata':'hira'}renderKeyboard()}
function insertText(text){
 if(from.value==='zh'&&/^[a-z]$/i.test(text)){insertZh(text);return}
 if(from.value==='ja'&&/^[a-z]$/i.test(text)){insertJa(text);return}
 if(from.value==='ko'&&text.length===1&&(vowels.has(text)||consonants.has(text))){insertHangul(text);return}
 if(zhState){if(text===' '){commitZh();return}commitZh()}
 if(jaState)commitJa();commitHangul();const a=input.selectionStart,b=input.selectionEnd;input.setRangeText(text,a,b,'end');input.focus();updateCount()
}
function backspace(){
 if(zhState&&input.selectionStart===zhState.end){zhState.raw=zhState.raw.slice(0,-1);if(zhState.raw)paintZh();else{input.setRangeText('',zhState.start,zhState.end,'end');zhState=null;clearImeBar();updateCount()}input.focus();return}
 if(jaState&&input.selectionStart===jaState.end){jaState.raw=jaState.raw.slice(0,-1);if(jaState.raw)paintJa();else{input.setRangeText('',jaState.start,jaState.end,'end');jaState=null;clearImeBar();updateCount()}input.focus();return}
 if(hangul&&input.selectionStart===hangul.end){
  if(hangul.t){hangul.t=finalSplit[hangul.t]?.[0]||'';paintHangul();return}
  if(hangul.v!==null){const rev=Object.entries(vowelJoin).find(([k,v])=>v===hangul.v);if(rev){hangul.v=rev[0][0]}else{hangul.v=null}paintHangul();return}
  input.setRangeText('',hangul.start,hangul.end,'end');commitHangul();updateCount();return
 }
 cancelCompositions();const a=input.selectionStart,b=input.selectionEnd;if(a!==b){input.setRangeText('',a,b,'end')}else if(a>0){const prev=Array.from(input.value.slice(0,a)).pop();input.setRangeText('',a-(prev?.length||1),a,'end')}input.focus();updateCount()
}
function renderKeyboard(){keyboard.innerHTML='';const lang=from.value;document.getElementById('keyboardLabel').textContent=labels[lang];for(const letters of layouts[lang]){const row=document.createElement('div');row.className='keyrow';for(const ch of Array.from(letters)){const key=document.createElement('button');key.type='button';key.className='key';key.textContent=ch;key.addEventListener('click',()=>insertText(ch));row.appendChild(key)}keyboard.appendChild(row)}if(lang==='ja'){const row=document.createElement('div');row.className='keyrow';const toggle=document.createElement('button');toggle.type='button';toggle.className='key special';toggle.style.maxWidth='230px';toggle.textContent=kanaMode==='hira'?'あ → ア 片假名':'ア → あ 平假名';toggle.onclick=toggleKana;row.appendChild(toggle);keyboard.appendChild(row)}const last=document.createElement('div');last.className='keyrow';const space=document.createElement('button');space.className='key space special';space.textContent='SPACE';space.onclick=()=>insertText(' ');const back=document.createElement('button');back.className='key special';back.textContent='⌫ 删除';back.onclick=backspace;const enter=document.createElement('button');enter.className='key special';enter.textContent='↵ 换行';enter.onclick=()=>insertText('\n');last.append(space,back,enter);keyboard.appendChild(last);document.getElementById('keyboardNote').textContent=lang==='ko'?'支持虚拟键盘韩文音节组合：ㅇ + ㅏ + ㄴ → 안。实体键盘请使用系统韩语输入法。':lang==='ja'?'点击字母自动转假名；点击切换按钮可输入平假名或片假名。':lang==='zh'?'点击字母输入拼音，点候选汉字选词；内置常用词库，更多词请用系统中文输入法。':'点击虚拟键盘或使用电脑实体键盘输入。'}
function updateCount(){document.getElementById('count').textContent=input.value.length+' / 5000'}
function clearInput(){cancelCompositions();input.value='';output.value='';document.getElementById('status').textContent='准备就绪';updateCount();input.focus()}
function swap(){cancelCompositions();const x=from.value;from.value=to.value;to.value=x;const old=input.value;if(output.value&&!output.value.startsWith('翻译失败')){input.value=output.value;output.value=old}renderKeyboard();updateCount()}
function setTone(tone){currentTone=tone;document.querySelectorAll('.tone').forEach(b=>b.classList.toggle('active',b.dataset.tone===tone))}
async function translateText(){if(zhState)commitZh();if(jaState)commitJa();commitHangul();const text=input.value.trim();if(!text){toast('请先输入需要翻译的内容');input.focus();return}const btn=document.getElementById('translateButton');btn.disabled=true;btn.textContent='正在翻译…';output.value='';document.getElementById('status').textContent='AI 正在组织语言…';try{const response=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,source:from.value,target:to.value,tone:currentTone})});const data=await response.json();if(!response.ok)throw new Error(data.error||'服务器暂时不可用');output.value=data.translation||'';document.getElementById('status').textContent=output.value?'翻译完成 ✓':'未收到译文'}catch(error){document.getElementById('status').textContent='翻译失败';output.value='翻译失败：'+error.message}finally{btn.disabled=false;btn.textContent='✦ 开始 AI 翻译 →'}}
async function copyText(){if(!output.value){toast('目前没有可复制的译文');return}try{await navigator.clipboard.writeText(output.value);toast('译文已复制 ✓')}catch(error){output.focus();output.select();toast('请按 ⌘C / Ctrl+C 复制选中文字')}}
from.addEventListener('change',()=>{if(zhState)commitZh();if(jaState)commitJa();cancelCompositions();renderKeyboard()});input.addEventListener('input',()=>{if(hangul&&input.selectionStart!==hangul.end)commitHangul();if(zhState&&input.selectionStart!==zhState.end){zhState=null;clearImeBar()}if(jaState&&input.selectionStart!==jaState.end){jaState=null;clearImeBar()}updateCount()});input.addEventListener('click',()=>{if(hangul&&input.selectionStart!==hangul.end)commitHangul();if(zhState&&input.selectionStart!==zhState.end)commitZh();if(jaState&&input.selectionStart!==jaState.end)commitJa()});renderKeyboard();updateCount();
</script></body></html>
